<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice · 声学沙盒生存（Sprint 2 移动与采集）</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/css/style.css" />
    <script>
      // window.__app 骨架：DOMContentLoaded 之前即可访问（SP1-05 生成端规范 §6）
      // main 模块随后填充真实 state/debug/reset。
      (function mountAppSkeleton() {
        if (window.__app) return;
        window.__app = {
          state: { ready: false, perf: { fps: 0, avgFrameMs: 0, drawCalls: 0, instances: 0, pixelRatio: 0, lastBench: null } },
          reset: function () {},
          debug: {},
        };
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair" class="crosshair" aria-hidden="true"></div>

    <div id="material-panel" class="panel"></div>

    <div id="hud" class="hud">
      <div class="hud-title">声学沙盒生存 · 移动与采集</div>
      <div class="hud-hint">
        WASD 移动 · 空格跳跃 · 按住左键挖掘 · 右键点击放置 · 右键拖动视角 · 点击画布捕获指针后移动鼠标转视角（Esc 释放） · 1-7 或点击库存切换材料<br />
        彩色八面体为三个固定环境声源（红=低频 / 黄=中频 / 蓝=高频）
      </div>
    </div>

    <div id="status-line" class="status-line" style="display:none"></div>

    <div id="inventory-bar" class="inventory-bar"></div>
    <div id="mining-bar" class="mining-bar" style="display:none">
      <div class="mining-fill" id="mining-fill"></div>
    </div>

    <div id="nogl-msg" class="nogl" style="display:none">
      当前浏览器不支持 WebGL2，已降级为只读界面模式（无 3D 渲染）。仍可通过 window.__app 读取世界与材料数据。
    </div>
    <div id="boot-error" class="nogl" style="display:none"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
